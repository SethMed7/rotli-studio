# Deploy studio.rotli.co on every push to main (a merge or an owner push), after the gates pass.
# Renders are not in git: the job fetches the published media (scripts/media.ts), builds the snapshot with the same
# privacy scan as a local export, and uploads it to the Railway project `rotli-studio`. Goldens are not run here
# (pixels are checked on the Mac that renders; a CI browser draws text differently).
name: Deploy studio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-studio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install
        run: |
          bun install --frozen-lockfile
          (cd motion && npm ci --omit=optional --no-audit --no-fund)
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Private names
        run: printf '%s\n' "$PRIVATE_MARKERS" > deploy/private-markers.local.txt
        env:
          PRIVATE_MARKERS: ${{ secrets.PRIVATE_MARKERS }}
      - name: Gates (typechecks, lint, format, public-repo gate, anidoodle inventory, sound)
        run: bun run verify --fast
        env:
          STUDIO_MAINTAINER: ${{ secrets.STUDIO_MAINTAINER }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # media.ts compares the pieces with the commit the media were published from
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          bun install --frozen-lockfile
          (cd motion && npm ci --omit=optional --no-audit --no-fund)
          npm install -g @railway/cli@4.27.4
      - name: Private names
        run: printf '%s\n' "$PRIVATE_MARKERS" > deploy/private-markers.local.txt
        env:
          PRIVATE_MARKERS: ${{ secrets.PRIVATE_MARKERS }}
      - name: Fetch the published renders
        run: bun scripts/media.ts fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the snapshot (inventory, staging, privacy scan)
        run: bun scripts/export-site.ts
        env:
          STUDIO_MAINTAINER: ${{ secrets.STUDIO_MAINTAINER }}
      - name: Deploy to Railway
        working-directory: site-dist
        run: railway up --ci --no-gitignore --service studio
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Check the live site
        run: |
          for i in $(seq 1 30); do
            live=$(curl -sf https://studio.rotli.co/ | grep -o 'motion\.[0-9a-f]*\.js' || true)
            built=$(ls site-dist/public/build | grep -o 'motion\.[0-9a-f]*\.js')
            if [ "$live" = "$built" ]; then echo "live: $live"; exit 0; fi
            sleep 10
          done
          echo "::error::studio.rotli.co still serves $live, expected $built"; exit 1
